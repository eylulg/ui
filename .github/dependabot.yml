version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*', 'eslint-plugin-storybook']
      lint-and-format:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier*',
            'knip',
            '@commitlint/*',
            'husky',
            'lint-staged',
          ]
      test:
        patterns: ['vitest*', '@testing-library/*', 'jsdom']
      build:
        patterns:
          [
            'vite',
            '@vitejs/*',
            'tailwindcss',
            '@tailwindcss/*',
            'typescript',
            'size-limit',
            '@size-limit/*',
          ]
      runtime:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react*',
            'react-aria-components',
            '@internationalized/*',
            'tailwind-merge',
            'lucide-react',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
