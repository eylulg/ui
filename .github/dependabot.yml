version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint pins the TypeScript range it supports; take majors by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet; take majors by hand.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*', 'eslint-plugin-storybook']
      lint-and-format:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier*',
            'knip',
            '@commitlint/*',
            'husky',
            'lint-staged',
          ]
      test:
        patterns: ['vitest*', '@testing-library/*', 'jsdom']
      build:
        patterns:
          [
            'vite',
            '@vitejs/*',
            'tailwindcss',
            '@tailwindcss/*',
            'typescript',
            'size-limit',
            '@size-limit/*',
          ]
      # react-aria-components pins react-aria to one exact version, so they move together.
      runtime:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react*',
            'react-aria',
            'react-aria-components',
            '@internationalized/*',
            'tailwind-merge',
            'lucide-react',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
